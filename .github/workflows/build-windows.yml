# Builds the Windows installers (NSIS .exe + MSI) and uploads them as artifacts,
# so a branch or PR can be smoke-tested without a Windows machine at hand.
#
# Why this isn't just `npm run tauri build`: the repo's `beforeBuildCommand` runs
# scripts/build-linux-cli.ps1, which cross-compiles the Linux CLI from Windows.
# On a runner that's the slowest, most fragile part of the build, so it's split
# out to a native Linux job and its output is handed to the Windows job as an
# artifact. `.github/tauri.ci.conf.json` swaps the hook for a plain `vite build`;
# everything the bundler needs in resources/ is staged by the steps below, in the
# same order and with the same hashes the PowerShell script produces.
#
# Nothing here publishes or releases — RELEASING.md remains the only path that
# cuts a version.

name: Build Windows installers

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: tsc + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
      # Node's type stripping (22.6+) runs the .ts tests directly — they're
      # excluded from the app tsconfig on purpose, they're node tests.
      - name: Unit tests
        working-directory: app
        run: node --experimental-strip-types --test src/*.test.ts

  linux-cli:
    name: winmux-linux-x64 (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # rust-lld is the linker (see src-tauri/.cargo/config.toml), so no
      # musl-gcc / musl-tools needed.
      - name: Build the CLI
        working-directory: app/src-tauri
        run: cargo build --release --target x86_64-unknown-linux-musl -p winmux
      - uses: actions/upload-artifact@v4
        with:
          name: winmux-linux-x64
          path: app/src-tauri/target/x86_64-unknown-linux-musl/release/winmux
          if-no-files-found: error
          retention-days: 7

  windows-bundle:
    name: NSIS + MSI
    needs: linux-cli
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # Same intent as the RUSTFLAGS block in scripts/build-linux-cli.ps1: keep
      # the build machine's absolute paths out of the shipped binary. On a
      # runner they'd only leak C:\Users\runneradmin, but a build that scrubs
      # only sometimes is worse than one that always does.
      - name: Scrub absolute paths from embedded strings
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE ".rustup" }
          $flags = "--remap-path-prefix=$cargoHome=cargo --remap-path-prefix=$($cargoHome -replace '\\','/')=cargo " +
                   "--remap-path-prefix=$rustupHome=rustup --remap-path-prefix=$($rustupHome -replace '\\','/')=rustup " +
                   "--remap-path-prefix=$env:USERPROFILE=user --remap-path-prefix=$($env:USERPROFILE -replace '\\','/')=user"
          "RUSTFLAGS=$flags" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage the Linux CLI
        uses: actions/download-artifact@v4
        with:
          name: winmux-linux-x64
          path: ${{ github.workspace }}/app/src-tauri/resources

      - name: Build + stage the Windows CLI
        working-directory: app/src-tauri
        shell: pwsh
        run: |
          cargo build --release -p winmux
          if ($LASTEXITCODE -ne 0) { throw "cargo build winmux failed ($LASTEXITCODE)" }
          Copy-Item target\release\winmux.exe resources\winmux-cli.exe -Force

      # remote-manifest.json is what the remote bootstrap compares against to
      # decide whether the server's copy is stale, so it has to describe the
      # binary we just built, not the one committed to the repo. UTF-8 WITHOUT
      # BOM — serde_json rejects a BOM with "expected value at line 1 column 1".
      - name: Regenerate remote-manifest.json
        working-directory: app/src-tauri/resources
        shell: pwsh
        run: |
          Move-Item winmux -Destination winmux-linux-x64 -Force
          $iso = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = @{
            "x86_64-linux" = @{
              path     = "winmux-linux-x64"
              sha256   = (Get-FileHash winmux-linux-x64 -Algorithm SHA256).Hash.ToLower()
              size     = (Get-Item winmux-linux-x64).Length
              built_at = $iso
            }
            "tmux-conf" = @{
              path     = "winmux-tmux.conf"
              sha256   = (Get-FileHash winmux-tmux.conf -Algorithm SHA256).Hash.ToLower()
              size     = (Get-Item winmux-tmux.conf).Length
              built_at = $iso
            }
          } | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("$PWD\remote-manifest.json", $manifest, [System.Text.UTF8Encoding]::new($false))

      # The bundler resolves `licenseFile` relative to src-tauri; the canonical
      # LICENSE lives at the repo root and this copy is gitignored.
      - name: Stage LICENSE for the bundler
        shell: pwsh
        run: Copy-Item LICENSE app\src-tauri\LICENSE -Force

      - run: npm ci
        working-directory: app

      - name: Tauri build
        working-directory: app
        run: npm run tauri -- build --config ../.github/tauri.ci.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: winmux-windows-installers
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      # The bare .exe is handy for a quick run without installing anything.
      # It is app.exe, not winmux.exe: the crate is named `app` and
      # tauri.conf.json sets no mainBinaryName.
      - uses: actions/upload-artifact@v4
        with:
          name: winmux-portable-exe
          path: app/src-tauri/target/release/app.exe
          if-no-files-found: warn
          retention-days: 30
